name: Materialize project source

on:
  push:
    paths:
      - ".bootstrap/parts/07"

permissions:
  contents: write

jobs:
  materialize:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Expand project source snapshot
        shell: bash
        run: |
          set -euo pipefail
          test -f .bootstrap/parts/07
          cat .bootstrap/parts/[0-9][0-9] > /tmp/whos-next-source.b64
          base64 --decode /tmp/whos-next-source.b64 > /tmp/whos-next-source.tar.xz
          tar -xJf /tmp/whos-next-source.tar.xz -C .
          rm -rf .bootstrap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No source changes to commit."
            exit 0
          fi
          git commit -m "chore: materialize WHO'S next project source"
          git push origin HEAD:main
