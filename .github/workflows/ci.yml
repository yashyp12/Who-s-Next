name: CI

on:
  push:
    branches: [main, 'feature/**']
  pull_request:
    branches: [main, feature/live-allocation-presence-notifications, feature/admin-notifications, feature/shift-aware-presence]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify JavaScript syntax
        run: |
          node --check site/src/app.mjs
          node --check site/src/notifications.mjs
          node --check site/src/domain.mjs
          node --check scripts/generate-config.mjs
      - name: Run domain tests
        run: node --test
