name: Materialize project source

on:
  push:
    paths:
      - ".bootstrap/source.zip.b64"

permissions:
  contents: write

jobs:
  materialize:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Expand project source snapshot
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f .bootstrap/source.zip.b64 ]]; then
            echo "Source snapshot already materialized."
            exit 0
          fi
          base64 --decode .bootstrap/source.zip.b64 > /tmp/whos-next-source.zip
          unzip -q -o /tmp/whos-next-source.zip -d .
          rm -rf .bootstrap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No source changes to commit."
            exit 0
          fi
          git commit -m "chore: materialize WHO'S next project source"
          git push origin HEAD:main
